    ['proxy', 'tailnet', '', 'oc', {}], ['tailnet', 'edge', '', 'oc', {}],
    ['edge', 'tabletfe', ':80', 'oc', V], ['edge', 'backoffice', '/admin', 'oc', V], ['edge', 'rest', '/api', 'oc', V], ['edge', 'ws', '/ws', 'oc', V],
    ['tabletfe', 'rest', '', 'oc', {}], ['backoffice', 'rest', '', 'oc', {}],
    ['ws', 'mosquitto', '', 'oc', V], ['mqttx', 'mosquitto', 'pub/sub', 'oc', V], ['mosquitto', 'hub', 'MQTT', 'oc', V],
    ['hub', 'spot', '', 'oc', {}], ['hub', 'arm', '', 'oc', {}], ['hub', 'rex', '', 'oc', {}],
    ['devq', 'sqs', 'FIFO', 'oc', V], ['sqs', 'hub', '', 'oc', V],
    ['dbm', 'postgres', 'pgx', 'oc', V], ['cron', 'postgres', '', 'oc', V], ['storage', 's3', '', 'oc', V],
    ['llm', 'openai', 'HTTPS', 'oc', {}], ['auth', 'oauth', '', 'oc', {}], ['tel', 'discord', '', 'oc', {}],
    ['ham', 'homeassistant', '', 'oc', V], ['homeassistant', 'lg', 'ThinQ', 'oc', V],
    ['tel', 'jaeger', 'OTLP', 'oc', V], ['jaeger', 'prometheus', '', 'oc', {}], ['alloy', 'loki', '', 'oc', {}], ['loki', 'grafana', '', 'oc', {}], ['prometheus', 'grafana', '', 'oc', {}],
    ['cctv', 'cctvcam', 'RTSP', 'oc', V],
    // lite
    ['tablet', 'rest', 'SSE + REST', 'live', V], ['operator', 'rest', 'REST', 'live', V],
    ['rest', 'mqttx', '요청', 'lite', V], ['rest', 'llm', '대화·문구', 'lite', {}],
    ['mqttx', 'devq', '선택지 명령', 'lite', {}], ['mqttx', 'postgres', 'SQL', 'lite', V], ['llm', 'postgres', '툴 조회', 'lite', { sourceHandle: 'b' }], ['devq', 's3', '', 'lite', V],
    ['llm', 'ollama', 'HTTP (로컬)', 'opt', {}], ['llm', 'openai', 'HTTPS (선택)', 'opt', {}], ['mqttx', 'homeassistant', 'HTTP (선택)', 'opt', {}],
    ['pgbuild', 'postgres', '빌드 때만 시드', 'build', {}],
  ].map(([s, t, label, kind, hs], i) => ({ id: 'e' + i, source: s, target: t, label, kind, type: 'smoothstep', ...hs, markerEnd: { type: MarkerType.ArrowClosed, width: 14, height: 14 } }));

  // ---- 단계: 누적. remove = 사라짐, move = lite 자리로 이동(이름도 바뀜), add = 새로 등장 ----
  const STEPS = [
    { title: '지금 전시장의 orchestration-server', remove: [], move: [], add: Object.keys(N).filter((k) => N[k].oc),
      summary: '6계층. 공개 진입(OCI VM) → Tailscale → mac-studio 의 Docker Compose(서버·백오피스·tablet-fe) → 플랫폼(MQTT·PostgreSQL·S3·SQS·HA·관측 6개) → 외부 SaaS, 그리고 현장 장치. 컨테이너 20개 남짓, 포트 수십 개, 운영자는 OAuth 로그인.',
      lists: { keep: ['전시 체험 로직은 서버 모듈 10개에 있다 — lite-oc 가 가져가는 건 이 부분'] } },
    { title: '1. 진입 계층을 걷어낸다', remove: ['proxy', 'tailnet', 'edge'], move: [], add: ['g-pc'],
      summary: 'lite-oc 는 "내 PC 한 대" 가 전제다. 공개 IP·HTTPS·로그인 게이트·tailnet·edge nginx 가 할 일이 없다. Gin 이 :8080 하나로 서비스 화면·어드민·API·에셋을 직접 연다.',
      lists: { rm: ['OCI nginx-proxy + 로그인 게이트', 'Tailscale tailnet', 'orchestration-nginx (edge)'], add: ['빈 상자 "내 PC 한 대" — 이제부터 여기로 모은다'] } },
    { title: '2. 관측·알림 스택을 뺀다', remove: ['jaeger', 'prometheus', 'alloy', 'loki', 'grafana', 'dozzle', 'tel', 'discord'], move: [], add: [],
      summary: '전시 운영용 추적·메트릭·로그 파이프라인(6컨테이너)과 Discord 알림은 라이트 버전에서 뺐다. 대신 어드민의 개발자 도구 패널과 서버 로그로 본다.',
      lists: { rm: ['Jaeger · Prometheus · Alloy · Loki · Grafana · Dozzle', 'telemetry 모듈(OTel · otelsql · Discord)'] } },
    { title: '3. 화면 둘 + 서버 → 바이너리 하나', remove: ['backoffice', 'tabletfe', 'cron', 'ws', 'auth', 'oauth'], move: ['tablet', 'operator', 'rest'], add: [],
      summary: '백오피스 SPA 와 tablet-fe 컨테이너를 따로 띄우지 않는다. 서비스 화면은 Next.js 정적 export 를 -tags embedweb 로, 어드민은 go:embed 로 바이너리 안에 넣었다. WebSocket Hub(MQTT 중계)는 SSE /api/stream 한 줄기로, 어드민 로그인은 로컬 전용이라 없앴다.',
      lists: { rm: ['orchestration-backoffice 컨테이너 → 어드민 HTML 내장', 'tablet-fe 컨테이너 → 서비스 화면 내장', 'WebSocket Hub → SSE', 'adminauth · OAuth → 로그인 없음', 'expire-sessions 배치 → 세션 1개 활성, 어드민에서 종료'], mv: ['REST API → Go 서버(Gin) :8080 — 정적 서빙까지 겸함', '태블릿·운영자 브라우저는 그대로, 서버 주소만 바뀜'] } },
    { title: '4. MQTT·SQS·로봇 → 프로세스 안의 시뮬레이션', remove: ['mosquitto', 'sqs', 'hub', 'spot', 'arm', 'rex', 'cctv', 'cctvcam', 'cars', 'carapp'], move: ['mqttx', 'devq'], add: [],
      summary: '브로커와 큐가 하던 일(세션·태스크·이벤트 자동화, 장치 명령 직렬화)은 같은 프로세스의 함수 호출과 인메모리 큐로 옮겼다. 실제 SPOT·팔·REX·Hub·CCTV 는 어드민 "로봇 콘솔" 에서 응답을 시뮬레이션하고, 미래차 앱은 구간 타이머로 대신한다.',
      lists: { rm: ['Mosquitto · ministack SQS', 'Hub · SPOT · 로봇팔 · REX · CCTV · 미래차 앱 (실물)'], mv: ['mqttx → 체험 엔진 (live.Notify → SSE)', 'devicequeue → 로봇 콘솔 시뮬레이션 (큐 상태 queued→accepted→started→completed 를 운영자가 넣음)'] } },
    { title: '5. DB 와 파일 저장소 → 로컬 파일', remove: ['dbm', 'storage'], move: ['postgres', 's3'], add: ['g-ext', 'pgbuild'],
      summary: 'PostgreSQL 은 SQLite 파일 하나(DATA_DIR/lite-oc.db)로, S3·MinIO 의 이미지·영상은 빌드 때 뽑아 바이너리에 내장(/s3/* 같은 주소)하고 어드민 업로드는 DATA_DIR/uploads 로. OC 운영 DB 는 빌드 때 ocdump 로 초기 데이터를 뽑을 때만 접속한다.',
      lists: { rm: ['db · migrate (goose) → 시작 때 스키마 자동 보강', 'storage (S3 클라이언트)'], mv: ['PostgreSQL → SQLite 파일 (내보내기/가져오기 zip 으로 PC 간 이동)', 'S3 · MinIO → 내장 에셋 32개 + /uploads'], add: ['OC PostgreSQL 은 "빌드 때만" 자리로 — 실행엔 불필요'] } },
    { title: '6. AI 는 택 1, 외부는 전부 선택', remove: ['ham', 'lg'], move: ['llm', 'openai', 'homeassistant'], add: ['ollama'],
      summary: 'OC 의 llm 모듈(제공자 failover + Whisper)은 Eino 에이전트로 바꿨다. 제공자 4개(Ollama·OpenAI 호환·Claude·커스텀) 중 하나를 어드민에서 고르고, Ollama 를 같은 PC 에 두면 인터넷 없이 돈다. Home Assistant 는 있으면 LG 가전까지, 없으면 그 부분만 건너뛴다.',
      lists: { rm: ['ha · equipment 모듈 → 체험 엔진이 직접 HA 호출', 'LG 가전 실물 → HA 뒤에서 선택'], mv: ['llm → 에이전트 (툴 12종 · 여정 문구 · 추천)', 'OpenAI·Claude·Gemini failover → 외부 LLM 택 1', 'Home Assistant → 선택 연동'], add: ['Ollama (로컬 LLM) — 완전 오프라인 경로'] } },
    { title: '7. 결과: 들고 가서 자기 PC 에서 켠다', remove: ['oc1', 'oc2', 'oc3', 'ocsrv', 'oc4', 'oc5', 'oc6'], move: [], add: ['g-dep', 'dmg', 'win', 'docker', 'oci'],
      summary: '같은 체험 로직, 같은 운영 데이터(동반자 5 · 장소 5 · 태스크 8 · 이벤트 5 · 디바이스 16 · 상품 10 · 차량 12)가 바이너리 하나에 들어 있다. dmg / zip / Docker 로 배포하고, 외부 연결은 전부 선택.',
      final: true },
  ];

  // 누적 상태 계산: 'hidden' | 'oc' | 'gone' | 'lite'
  function stateAt(step) {
    const st = {};
    Object.keys(N).forEach((k) => { st[k] = 'hidden'; });
    for (let i = 0; i <= step; i++) {
      const s = STEPS[i];
      s.add.forEach((k) => { st[k] = N[k].oc ? 'oc' : 'lite'; });
      s.move.forEach((k) => { st[k] = 'lite'; });
      s.remove.forEach((k) => { st[k] = 'gone'; });
    }
    return st;
  }

  function Box({ data }) {
    const d = data;
    const cls = 'n ' + d.cls + (d.state === 'gone' ? ' gone' : '') + (d.state === 'lite' && d.moved ? ' lite' : '');
    return h('div', { className: cls },
      h(Handle, { type: 'target', position: Position.Left, style: { opacity: 0 } }),
      h(Handle, { type: 'target', position: Position.Top, id: 't', style: { opacity: 0 } }),
      d.state === 'lite' && d.moved ? h('span', { className: 'from' }, '← ' + d.from) : null,
      d.state === 'gone' ? h('span', { className: 'cut' }, '✂') : null,
      h('b', null, d.title), h('span', null, d.sub),
      h(Handle, { type: 'source', position: Position.Right, style: { opacity: 0 } }),
      h(Handle, { type: 'source', position: Position.Bottom, id: 'b', style: { opacity: 0 } }));
  }
  function Grp({ data }) { return h('div', { className: 'grp ' + data.cls }, data.title, data.hint ? h('span', { className: 'hint' }, data.hint) : null); }
  const nodeTypes = { box: Box, grp: Grp };

  function Inner() {
    const [step, setStep] = useState(0);
    const [settled, setSettled] = useState(true);
    const [auto, setAuto] = useState(false);
    const rf = useReactFlow();
    const st = useMemo(() => stateAt(step), [step]);
    const last = STEPS.length - 1;
    const go = useCallback((n) => setStep((s) => Math.max(0, Math.min(last, typeof n === 'function' ? n(s) : n))), [last]);

    // 단계 바뀌면: 간선 숨김 → 노드 이동 끝난 뒤 간선 표시 + 화면 맞춤
    useEffect(() => {
      setSettled(false);
      const vis = Object.keys(st).filter((k) => st[k] === 'oc' || st[k] === 'lite').map((id) => ({ id }));
      const fit = () => rf.fitView({ nodes: vis, padding: 0.1, duration: 900 });
      const t1 = setTimeout(fit, 80);
      const t0 = step === 0 ? setTimeout(fit, 500) : null;
      const t2 = setTimeout(() => setSettled(true), 1000);
      return () => { clearTimeout(t1); clearTimeout(t2); if (t0) clearTimeout(t0); };
    }, [step, st, rf]);
    useEffect(() => {
      if (!auto) return;
      if (step >= last) { setAuto(false); return; }
      const t = setTimeout(() => go((s) => s + 1), 4200);
      return () => clearTimeout(t);
    }, [auto, step, last, go]);
    useEffect(() => {
      const onKey = (e) => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go((s) => s + 1); } if (e.key === 'ArrowLeft') go((s) => s - 1); if (e.key === 'Home') go(0); };
      window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
    }, [go]);

    const nodes = useMemo(() => Object.values(N).map((n) => {
      const s = st[n.id];
      const useLite = s === 'lite' || (s === 'hidden' && !n.oc) || (s === 'gone' && !n.oc);
      const p = (useLite ? n.lite : n.oc) || n.oc || n.lite;
      const moved = !!(n.oc && n.lite);
      const w = p.w || W, hh = p.h || H;
      if (n.grp) return { id: n.id, type: 'grp', position: { x: p.x, y: p.y }, style: { width: p.w, height: p.h }, zIndex: -1, selectable: false, draggable: false, className: s === 'hidden' ? 'hidden' : s === 'gone' ? 'gone' : '', data: { cls: n.cls, title: p.title, hint: p.hint } };
      return { id: n.id, type: 'box', position: { x: p.x, y: p.y }, style: { width: w, height: hh }, draggable: false, selectable: false, className: s === 'hidden' ? 'hidden' : s === 'gone' ? 'gone' : '',
        data: { cls: p.cls, title: p.title, sub: p.sub, state: s, moved, from: moved ? n.oc.title.replace(/^\S+\s/, '') : '' } };
    }), [st]);
    const edges = useMemo(() => EDGES.map((e) => {
      const a = st[e.source], b = st[e.target];
      const show = e.kind === 'oc' ? (a === 'oc' && b === 'oc') : (a === 'lite' && b === 'lite' && settled);
      return { ...e, className: (e.kind === 'oc' ? 'oc' : e.kind) + (show ? '' : ' hide'), animated: e.kind === 'live' && show };
    }), [st, settled]);

    const cur = STEPS[step];
    const L = cur.lists || {};
    const list = (cls, title, items) => items && items.length ? [h('h3', { key: 'h' + title, className: cls }, title), h('ul', { key: 'u' + title }, items.map((t) => h('li', { key: t }, t)))] : null;
    return h('div', { style: { display: 'contents' } },
      h('header', null,
        h('h1', null, 'OC → lite-oc', h('small', null, '무엇을 빼고, 무엇을 합쳤나 — 단계별로')),
        h('a', { href: 'https://zero1ne-26.github.io/doc/flow.html', target: '_blank' }, 'OC 전체 구성도 ↗'), h('span', { style: { color: '#cbd5e1' } }, '·'),
        h('a', { href: './index.html' }, 'lite-oc 구성도 ↗'),
        h('div', { className: 'sp' }),
        h('button', { className: 'btn', onClick: () => { setAuto(false); go(0); }, disabled: step === 0 }, '⏮ 처음'),
        h('button', { className: 'btn', onClick: () => { setAuto(false); go((s) => s - 1); }, disabled: step === 0 }, '◀ 이전'),
        h('div', { className: 'dots' }, STEPS.map((_, i) => h('i', { key: i, className: i === step ? 'cur' : i < step ? 'done' : '', onClick: () => { setAuto(false); go(i); }, title: STEPS[i].title }))),
        h('button', { className: 'btn primary', onClick: () => { setAuto(false); go((s) => s + 1); }, disabled: step === last }, '다음 ▶'),
        h('button', { className: 'btn' + (auto ? ' on' : ''), onClick: () => { if (step >= last) go(0); setAuto((v) => !v); } }, auto ? '⏸ 자동 재생 중' : '▶ 자동 재생')),
      h('main', null,
        h('div', { className: 'canvas' },
          h(Flow, { nodes, edges, nodeTypes, fitView: true, fitViewOptions: { padding: 0.1 }, minZoom: 0.15, maxZoom: 1.6, nodesDraggable: false, nodesConnectable: false, elementsSelectable: false, proOptions: { hideAttribution: true } },
            h(Background, { gap: 24, color: '#dfe4ea' }), h(Controls, { showInteractive: false }), h(MiniMap, { pannable: true, zoomable: true, nodeColor: (n) => n.type === 'grp' ? '#e5e9f0' : n.className ? '#f1f1f1' : '#b9c7e6' }))),
        h('aside', { key: step, className: 'fade' },
          h('div', { className: 'step' }, (step + 1) + ' / ' + STEPS.length + ' · ←/→ 키 또는 버튼'),
          h('h2', null, cur.title),
          h('p', null, cur.summary),
          list('rm', '✂ 뺀 것', L.rm), list('mv', '→ 바꾼 것', L.mv), list('add', '+ 새로', L.add), list('', '유지', L.keep),
          cur.final ? h('table', null,
            h('thead', null, h('tr', null, h('th', null, ''), h('th', null, 'OC'), h('th', null, 'lite-oc'))),
            h('tbody', null, [
              ['실행 단위', '컨테이너 20개 남짓 + 호스트 서비스', '바이너리 1개'],
              ['진입', 'OCI 공개 IP · HTTPS · 로그인 게이트 · tailnet · nginx', ':8080 하나, 로그인 없음'],
              ['화면', '백오피스 SPA · tablet-fe 컨테이너', '둘 다 바이너리에 내장'],
              ['실시간', 'MQTT 브로커 + WebSocket 중계', 'SSE /api/stream'],
              ['DB', 'PostgreSQL + goose', 'SQLite 파일 1개, 자동 스키마'],
              ['파일', 'S3 · MinIO', '내장 에셋 + /uploads'],
              ['장치 명령', 'SQS FIFO → Hub → 실물 로봇', '인메모리 큐 → 콘솔 시뮬'],
              ['AI', '제공자 failover + Whisper', '제공자 택 1 (Ollama 면 오프라인)'],
              ['관측', 'Jaeger · Prometheus · Loki · Grafana …', '없음 (개발자 도구 패널)'],
              ['초기 데이터', '운영 DB', '빌드 때 뽑아 내장 (seed_version)'],
            ].map((r) => h('tr', { key: r[0] }, h('th', null, r[0]), h('td', { className: 'oc' }, r[1]), h('td', { className: 'lite' }, r[2]))))) : null,
          step === 0 ? h('p', { style: { marginTop: 14, color: 'var(--muted)' } }, '"다음 ▶" 또는 "▶ 자동 재생" 으로 OC 가 lite-oc 로 줄어드는 과정을 본다. 회색으로 작아지는 건 뺀 것, 오른쪽 상자로 날아가는 건 바뀐 것.') : null)));
  }
  function App() { return h(ReactFlowProvider, null, h(Inner)); }
  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
</script>
</body>
